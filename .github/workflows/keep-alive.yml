name: Keep Render services awake

# Render's free tier spins a web service down after 15 minutes of no
# incoming requests, and the next request pays a 30-60s cold-start penalty.
# Pinging both services well inside that window keeps them warm.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        if: ${{ vars.BACKEND_URL != '' }}
        run: curl -fsS --max-time 20 "${{ vars.BACKEND_URL }}/health" || echo "backend ping failed (service may be cold-starting)"

      - name: Ping frontend
        if: ${{ vars.FRONTEND_URL != '' }}
        run: curl -fsS --max-time 20 "${{ vars.FRONTEND_URL }}" -o /dev/null || echo "frontend ping failed (service may be cold-starting)"
